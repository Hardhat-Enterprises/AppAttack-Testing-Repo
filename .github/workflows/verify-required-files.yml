name: Verify Required Files

on:
  pull_request:
    branches: [ main ]

jobs:
  verify-required-files:
    name: verify-required-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files in this push
        id: changed
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          FILES=$(git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check for required file types
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          echo "Changed files in this push:"
          echo "$FILES"
          echo

          HAS_PDF=false
          HAS_TEX=false
          HAS_IMAGE=false

          while IFS= read -r f; do
            case "$f" in
              *.pdf|*.PDF) HAS_PDF=true ;;
              *.tex|*.TEX) HAS_TEX=true ;;
              *.jpg|*.jpeg|*.png|*.gif|*.bmp|*.webp|*.tiff|*.JPG|*.JPEG|*.PNG) HAS_IMAGE=true ;;
            esac
          done <<< "$FILES"

          MISSING=""
          [ "$HAS_PDF" = false ]   && MISSING="$MISSING .pdf"
          [ "$HAS_TEX" = false ]   && MISSING="$MISSING .tex"
          [ "$HAS_IMAGE" = false ] && MISSING="$MISSING image(.jpg/.png/etc)"

          if [ -n "$MISSING" ]; then
            echo "❌ This push is missing required file type(s):$MISSING"
            exit 1
          fi

          echo "✅ All required file types present (.pdf, .tex, and at least one image)."
